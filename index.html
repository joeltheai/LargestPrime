<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Scroll through all 41,024,320 digits of the largest known prime number.">
  <title>The Largest Known Prime</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="digits.mjs">
  <script type="module" src="viewer.mjs"></script>
</head>
<body>
  <main>
    <div class="reader-header">
      <header class="intro">
        <div class="intro-line">
          <h1>The largest known prime</h1>
          <p class="formula">2<sup>136,279,841</sup> − 1</p>
        </div>
        <div class="intro-line intro-details">
          <p class="credit">41,024,320 digits. Discovered by Luke Durant on October 12, 2024.</p>
          <a href="https://www.mersenne.org/primes/?press=M136279841" target="_blank" rel="noopener"
             aria-label="GIMPS discovery announcement (opens in a new tab)">GIMPS discovery announcement <span aria-hidden="true">↗</span></a>
        </div>
      </header>
      <div class="toolbar">
        <div class="controls">
          <p id="position" class="position">Digits 1 – 41,024,320</p>
          <form id="jump-form">
            <label for="digit">Jump to digit</label>
            <input id="digit" name="digit" type="text" inputmode="numeric" enterkeyhint="go" autocomplete="off"
                   maxlength="16" placeholder="1–41,024,320" aria-describedby="jump-error" required>
          </form>
        </div>
        <p id="jump-error" role="alert" hidden></p>
        <div class="load-feedback">
          <span id="load-status" role="status"></span>
          <button type="button" id="retry" hidden>Retry</button>
        </div>
      </div>
    </div>
    <section class="explorer" aria-label="Decimal digit explorer">
      <noscript><p>Enable JavaScript to scroll through the digits, or <a href="https://www.mersenne.org/primes/digits/M136279841.zip">download the digit file from GIMPS</a>.</p></noscript>
      <div id="digit-list" aria-label="Digits in decimal order">
        <span id="digit-measure" aria-hidden="true">0</span>
        <div id="rows"></div>
      </div>
    </section>
  </main>
  <input id="position-slider" type="range" min="0" max="10000" value="0"
         aria-label="Scroll through digits" aria-orientation="vertical" hidden>
  <script id="initial-digits" type="text/plain"></script>
</body>
</html>
